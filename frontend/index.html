<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Viewport -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <!-- Theme -->
    <meta name="theme-color" content="#030508" />
    <meta name="color-scheme" content="dark" />

    <!-- App Metadata -->
    <meta
      name="description"
      content="J.A.R.V.I.S. — Personal AI Command Interface"
    />
    <meta name="application-name" content="J.A.R.V.I.S." />
    <meta name="author" content="J.A.R.V.I.S." />
    <meta name="robots" content="noindex, nofollow" />

    <!-- Mobile -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta
      name="apple-mobile-web-app-title"
      content="J.A.R.V.I.S."
    />

    <!-- Open Graph -->
    <meta
      property="og:title"
      content="J.A.R.V.I.S. // Command Interface"
    />
    <meta
      property="og:description"
      content="Personal AI Command Interface"
    />
    <meta property="og:type" content="website" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

    <!-- Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800&family=Rajdhani:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Title -->
    <title>J.A.R.V.I.S.</title>

    <!-- Initial Loading Screen -->
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #030508;
      }

      body {
        overflow: hidden;
        font-family: "Rajdhani", sans-serif;
      }

      #boot-screen {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        align-items: center;
        justify-content: center;
        background:
          radial-gradient(
            circle at center,
            rgba(0, 229, 255, 0.08),
            transparent 35%
          ),
          #030508;
        transition:
          opacity 0.5s ease,
          visibility 0.5s ease;
      }

      #boot-screen.hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .boot-core {
        position: relative;
        width: 110px;
        height: 110px;
        border-radius: 50%;
        border: 1px solid rgba(0, 229, 255, 0.45);
        box-shadow:
          0 0 20px rgba(0, 229, 255, 0.2),
          inset 0 0 25px rgba(0, 229, 255, 0.08);
        animation: bootPulse 1.8s ease-in-out infinite;
      }

      .boot-core::before,
      .boot-core::after {
        content: "";
        position: absolute;
        inset: 14px;
        border-radius: 50%;
        border: 1px solid rgba(255, 60, 60, 0.5);
      }

      .boot-core::after {
        inset: 31px;
        border-color: rgba(0, 229, 255, 0.8);
      }

      .boot-dot {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 8px;
        height: 8px;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        background: #00e5ff;
        box-shadow: 0 0 18px #00e5ff;
      }

      @keyframes bootPulse {
        50% {
          transform: scale(1.05);
          opacity: 0.7;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .boot-core {
          animation: none;
        }
      }
    </style>
  </head>

  <body>
    <!-- Boot Screen -->
    <div id="boot-screen" aria-hidden="true">
      <div class="boot-core">
        <div class="boot-dot"></div>
      </div>
    </div>

    <!-- React Root -->
    <div id="root"></div>

    <!-- React -->
    <script type="module" src="/src/main.jsx"></script>

    <!-- No JavaScript -->
    <noscript>
      <div
        style="
          min-height: 100vh;
          display: grid;
          place-items: center;
          background: #030508;
          color: #00e5ff;
          font-family: monospace;
        "
      >
        JavaScript required.
      </div>
    </noscript>

    <!-- Remove Boot Screen -->
    <script>
      window.addEventListener("load", () => {
        const bootScreen = document.getElementById("boot-screen");

        setTimeout(() => {
          bootScreen?.classList.add("hidden");
        }, 700);
      });
    </script>
  </body>
</html>
